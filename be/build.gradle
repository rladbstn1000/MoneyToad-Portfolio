plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.potg'
version = '0.0.1-SNAPSHOT'
description = 'don'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation 'org.apache.commons:commons-csv:1.10.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.12.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// The administrator CLI is deliberately absent from the ordinary runtime artifact.
sourceSets {
    maintenance {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.maintenance.output
        runtimeClasspath += sourceSets.maintenance.output
    }
}
configurations {
    maintenanceImplementation.extendsFrom implementation
    maintenanceRuntimeOnly.extendsFrom runtimeOnly
}
tasks.register('demoCleanupJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    group = 'build'
    description = 'Package the independent JDBC administrator CLI (no Spring application startup).'
    archiveClassifier = 'demo-cleanup'
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'com.potg.don.maintenance.DemoCleanupCommand'
    classpath = sourceSets.maintenance.runtimeClasspath
}
